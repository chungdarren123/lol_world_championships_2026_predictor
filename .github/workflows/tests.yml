name: Python project checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the audit rules (synthetic data only)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
  bayesian-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned model dependencies
        run: python -m pip install -r requirements-bayes.lock.txt
      - name: Check model constraints and data boundaries
        env:
          PYTHONPATH: src
          MPLCONFIGDIR: artifacts/matplotlib_cache
          PYTENSOR_FLAGS: cxx=,compiledir=artifacts/pytensor_cache
        run: python -m unittest discover -s tests -v
